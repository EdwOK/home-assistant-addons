name: Dahua P2P Tunnel
version: "0.2.0"
slug: dh_p2p
description: Reach a Dahua VTO/camera over Dahua P2P (serial number) using dh-p2p
url: https://github.com/EdwOK/home-assistant-addons/tree/main/dh_p2p
# Prebuilt by .github/workflows/build.yaml; HA pulls it instead of building.
image: ghcr.io/edwok/{arch}-addon-dh_p2p
arch:
  - amd64
  - aarch64
startup: services
boot: auto
# Tunnels listen on the HA host itself, so the Dahua integration can use 127.0.0.1.
host_network: true
options:
  serial: ""
  bind_address: 127.0.0.1
  http_port: 8080
  rtsp_port: 1554
  debug_log: false
schema:
  serial: str
  bind_address: str
  http_port: port
  rtsp_port: port
  debug_log: bool
