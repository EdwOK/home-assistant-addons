# Builds each add-on image natively per architecture and publishes it to
# GHCR, so Home Assistant pulls a ready image instead of compiling on-device.
name: Build add-ons

on:
  push:
    branches: [main]
    paths:
      - "dh_p2p/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dh_p2p:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # GHCR image names must be lowercase; must match `image:` in config.yaml.
      IMAGE: ghcr.io/edwok/${{ matrix.arch }}-addon-dh_p2p
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' dh_p2p/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: dh_p2p
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            io.hass.name=Dahua P2P Tunnel
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
            org.opencontainers.image.source=https://github.com/EdwOK/home-assistant-addons
          cache-from: type=gha,scope=dh_p2p-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dh_p2p-${{ matrix.arch }}
